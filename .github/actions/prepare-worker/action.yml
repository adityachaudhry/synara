name: Prepare worker disk
description: Build and checkpoint the worker in the target Railway environment.
inputs:
  service:
    required: true
    description: Railway controller service
  environment:
    required: true
    description: Railway environment
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - shell: bash
      run: npm install --global @railway/cli
    - shell: bash
      run: bun install --frozen-lockfile --filter @synara/cli
    - shell: bash
      run: bun run --cwd apps/server build:provider-worker
    - name: Prepare the worker disk from this commit
      shell: bash
      env:
        WORKER_SERVICE: ${{ inputs.service }}
        WORKER_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        bun -e '
          import { execFileSync } from "node:child_process";
          import { prepareProviderWorkerTemplate } from "./apps/server/src/providerWorker/prepareTemplate.ts";
          const target = ["--service", process.env.WORKER_SERVICE, "--project", "7bf8f727-f0a8-4aea-b1b4-4266aecc49f0", "--environment", process.env.WORKER_ENVIRONMENT];
          const railwayToken = process.env.RAILWAY_TOKEN;
          const variables = JSON.parse(execFileSync("railway", ["variables", ...target, "--json"], { encoding: "utf8" }));
          Object.assign(process.env, variables);
          const prepared = await prepareProviderWorkerTemplate("apps/server/dist/provider-worker/workerMain.mjs");
          execFileSync("railway", ["variables", ...target, "--set", `SYNARA_PROVIDER_WORKER_TEMPLATE_CHECKPOINT=${prepared.key}`, "--skip-deploys"], { env: { ...process.env, RAILWAY_TOKEN: railwayToken }, stdio: "pipe" });
          console.log(JSON.stringify({ checkpoint: prepared.key, workerSha256: prepared.sha256, reused: prepared.reused }));
        '
