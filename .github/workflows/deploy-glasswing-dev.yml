name: deploy Glasswing dev

on:
  push:
    branches: [glasswingos/dev]
    paths:
      - 'apps/server/**'
      - 'packages/**'
      - 'scripts/**'
      - '**/package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'patches/**'
      - 'tsconfig*.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-entrypoint.sh'
      - 'railway.json'
      - '.github/workflows/deploy-glasswing-dev.yml'
  workflow_dispatch:

concurrency:
  group: deploy-glasswing-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global @railway/cli
      - run: bun install --frozen-lockfile --filter @synara/cli
      - run: bun run --cwd apps/server build:provider-worker
      - name: Prepare the dev worker disk from this commit
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          bun -e '
            import { execFileSync } from "node:child_process";
            import { prepareProviderWorkerTemplate } from "./apps/server/src/providerWorker/prepareTemplate.ts";
            const target = ["--service", "synara-gitea-dev", "--project", "7bf8f727-f0a8-4aea-b1b4-4266aecc49f0", "--environment", "dev"];
            const railwayToken = process.env.RAILWAY_TOKEN;
            const variables = JSON.parse(execFileSync("railway", ["variables", ...target, "--json"], { encoding: "utf8" }));
            Object.assign(process.env, variables);
            const prepared = await prepareProviderWorkerTemplate("apps/server/dist/provider-worker/workerMain.mjs");
            execFileSync("railway", ["variables", ...target, "--set", `SYNARA_PROVIDER_WORKER_TEMPLATE_CHECKPOINT=${prepared.key}`, "--skip-deploys"], { env: { ...process.env, RAILWAY_TOKEN: railwayToken }, stdio: "pipe" });
            console.log(JSON.stringify({ checkpoint: prepared.key, workerSha256: prepared.sha256, reused: prepared.reused }));
          '
      - run: railway up --service synara-gitea-dev --project 7bf8f727-f0a8-4aea-b1b4-4266aecc49f0 --environment dev --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
