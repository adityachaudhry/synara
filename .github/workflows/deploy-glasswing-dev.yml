name: deploy Glasswing dev

on:
  push:
    branches: [glasswingos/dev]
    paths:
      - 'apps/server/**'
      - 'packages/**'
      - 'scripts/**'
      - '**/package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'patches/**'
      - 'tsconfig*.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-entrypoint.sh'
      - 'railway.json'
      - '.github/workflows/deploy-glasswing-dev.yml'
      - '.github/actions/prepare-worker/**'
  workflow_dispatch:

concurrency:
  group: deploy-glasswing-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-worker
        with:
          service: synara-gitea-dev
          environment: dev
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - run: railway up --service synara-gitea-dev --project 7bf8f727-f0a8-4aea-b1b4-4266aecc49f0 --environment dev --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
