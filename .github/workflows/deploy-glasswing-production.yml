name: deploy Glasswing production

on:
  push:
    branches: [glasswingos/main]
    paths:
      - 'apps/server/**'
      - 'packages/**'
      - 'scripts/**'
      - '**/package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'patches/**'
      - 'tsconfig*.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-entrypoint.sh'
      - 'railway.json'
      - '.github/workflows/deploy-glasswing-production.yml'
      - '.github/actions/prepare-worker/**'
  workflow_dispatch:
    inputs:
      prepare_only:
        description: Prepare the production worker disk without deploying the application
        type: boolean
        default: false

concurrency:
  group: deploy-glasswing-production
  cancel-in-progress: false

env:
  RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID_PRODUCTION || '2fb578c6-304e-4a97-abd4-38b3897d9030' }}
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION_NEW }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/glasswingos/main' || (github.ref == 'refs/heads/glasswingos/dev' && inputs.prepare_only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --global @railway/cli
      - name: Set the production sandbox credential
        run: printf '%s' "$RAILWAY_TOKEN" | railway variable set --stdin SYNARA_RAILWAY_SANDBOX_TOKEN --service synara-gitea-production --project "$RAILWAY_PROJECT_ID" --environment production --skip-deploys
      - name: Record the deployed source revision
        run: railway variable set "SYNARA_COMMIT=$GITHUB_SHA" --service synara-gitea-production --project "$RAILWAY_PROJECT_ID" --environment production --skip-deploys
      - uses: ./.github/actions/prepare-worker
        with:
          project: ${{ env.RAILWAY_PROJECT_ID }}
          service: synara-gitea-production
          environment: production
      - if: ${{ !inputs.prepare_only }}
        run: railway up --service synara-gitea-production --project "$RAILWAY_PROJECT_ID" --environment production --ci
