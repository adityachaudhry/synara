name: deploy Glasswing production

on:
  push:
    branches: [glasswingos/main]
    paths:
      - 'apps/server/**'
      - 'packages/**'
      - 'scripts/**'
      - '**/package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'patches/**'
      - 'tsconfig*.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-entrypoint.sh'
      - 'railway.json'
      - '.github/workflows/deploy-glasswing-production.yml'
      - '.github/actions/prepare-worker/**'
      - '.github/actions/azure-controller-image/**'
      - '.github/actions/azure-revision-swap/**'
  workflow_dispatch:
    inputs:
      prepare_only:
        description: Prepare the production worker disk without deploying the application
        type: boolean
        default: false
      azure_build_only:
        description: Only build and push the controller image to Azure Container Registry (no deploy, no Railway, no worker preparation)
        type: boolean
        default: false

concurrency:
  group: deploy-glasswing-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Azure sign-in through OIDC

env:
  # Where this environment's controller runs: railway (default) or azure; none once Glasswing's
  # agent service serves the environment (the retired controller must not start again).
  DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET_PRODUCTION || 'railway' }}
  AZURE_RESOURCE_GROUP: rg-glasswing-prod
  AZURE_CONTAINER_APP: synara-controller
  RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID_PRODUCTION || '2fb578c6-304e-4a97-abd4-38b3897d9030' }}
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION_NEW }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/glasswingos/main' || (github.ref == 'refs/heads/glasswingos/dev' && inputs.prepare_only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the deploy target
        if: ${{ !inputs.azure_build_only }}
        run: |
          case "$DEPLOY_TARGET" in
            railway | azure) echo "Deploy target: $DEPLOY_TARGET" ;;
            none) echo "::notice::Production's controller is retired (Glasswing's agent service serves production); nothing to deploy." ;;
            *) echo "::error::DEPLOY_TARGET_PRODUCTION must be railway, azure or none, not '$DEPLOY_TARGET'"; exit 1 ;;
          esac

      # Railway
      - if: env.DEPLOY_TARGET == 'railway' && !inputs.azure_build_only
        run: npm install --global @railway/cli
      - name: Record the deployed source revision
        if: env.DEPLOY_TARGET == 'railway' && !inputs.azure_build_only
        run: railway variable set "SYNARA_COMMIT=$GITHUB_SHA" --service synara-gitea-production --project "$RAILWAY_PROJECT_ID" --environment production --skip-deploys
      - if: env.DEPLOY_TARGET == 'railway' && !inputs.azure_build_only
        uses: ./.github/actions/prepare-worker
        with:
          project: ${{ env.RAILWAY_PROJECT_ID }}
          service: synara-gitea-production
          environment: production
      - if: env.DEPLOY_TARGET == 'railway' && !inputs.azure_build_only && !inputs.prepare_only
        run: railway up --service synara-gitea-production --project "$RAILWAY_PROJECT_ID" --environment production --ci
      - name: Retire obsolete unclaimed warm pools
        if: env.DEPLOY_TARGET == 'railway' && !inputs.azure_build_only && !inputs.prepare_only
        run: node .github/actions/prepare-worker/cleanup.mjs
        env:
          WORKER_PROJECT: ${{ env.RAILWAY_PROJECT_ID }}
          WORKER_SERVICE: synara-gitea-production
          WORKER_ENVIRONMENT: production

      # Azure Container Apps
      - name: Sign in to Azure
        if: env.DEPLOY_TARGET == 'azure' || inputs.azure_build_only
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PRODUCTION }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push the controller image
        id: image
        if: (env.DEPLOY_TARGET == 'azure' && !inputs.prepare_only) || inputs.azure_build_only
        uses: ./.github/actions/azure-controller-image
      - name: Find the controller's container app
        id: app
        if: env.DEPLOY_TARGET == 'azure' && !inputs.azure_build_only
        run: |
          found=$(az containerapp list --resource-group "$AZURE_RESOURCE_GROUP" --query "[?name=='$AZURE_CONTAINER_APP'].name" --output tsv)
          if [ -n "$found" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Container app $AZURE_CONTAINER_APP does not exist in $AZURE_RESOURCE_GROUP yet: nothing is prepared or deployed${{ steps.image.outputs.tag && format(' (image pushed: {0})', steps.image.outputs.tag) || '' }}."
          fi
      # prepare_only builds the sandbox image and writes the settings file without touching the app;
      # the next deploy reuses the image and sets the settings on its new revision.
      - if: steps.app.outputs.exists == 'true'
        uses: ./.github/actions/prepare-worker
        with:
          target: azure
          service: ${{ env.AZURE_CONTAINER_APP }}
          environment: production
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
      - name: Swap the controller revision
        if: steps.app.outputs.exists == 'true' && !inputs.prepare_only
        uses: ./.github/actions/azure-revision-swap
        with:
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          container-app: ${{ env.AZURE_CONTAINER_APP }}
          image: ${{ steps.image.outputs.image }}
          env-file: .controller-env-updates
      - name: Retire obsolete unclaimed warm pools
        if: steps.app.outputs.exists == 'true' && !inputs.prepare_only
        run: node .github/actions/prepare-worker/cleanup.mjs
        env:
          WORKER_TARGET: azure
          WORKER_RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
          WORKER_CONTAINER_APP: ${{ env.AZURE_CONTAINER_APP }}
