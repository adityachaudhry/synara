name: publish Glasswing embed

on:
  push:
    branches: [glasswingos/dev, glasswingos/main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '**/package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'patches/**'
      - 'tsconfig*.json'
      - '.github/workflows/publish-glasswing-embed.yml'
  workflow_dispatch:

concurrency:
  group: publish-glasswing-embed-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SYNARA_PROTOCOL_VERSION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore checked package
        id: package
        uses: actions/cache@v4
        with:
          path: apps/web/dist-embed/package
          # Workflow/README changes don't change the compiled browser code.
          key: embed-package-v1-protocol-${{ env.SYNARA_PROTOCOL_VERSION }}-${{ hashFiles('apps/web/src/**', 'apps/web/public/**', 'apps/web/scripts/**', 'apps/web/*.ts', 'apps/web/*.json', 'packages/*/src/**', 'packages/*/package.json', 'packages/*/tsconfig*.json', 'package.json', 'apps/*/package.json', 'scripts/package.json', 'bun.lock', 'bunfig.toml', 'patches/**', 'tsconfig*.json') }}
      - uses: actions/cache@v4
        if: steps.package.outputs.cache-hit != 'true'
        with:
          path: ~/.bun/install/cache
          key: embed-bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: embed-bun-${{ runner.os }}-
      - name: Restore incremental declarations
        if: steps.package.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: apps/web/dist-embed/types
          key: embed-types-v1-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/web/tsconfig*.json', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: embed-types-v1-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/web/tsconfig*.json', 'tsconfig*.json') }}-
      - name: Restore per-file React compiler results
        if: steps.package.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: apps/web/dist-embed/react-compiler-cache
          key: embed-react-v1-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/web/scripts/cached-react-compiler.mjs', 'apps/web/vite.embed.config.ts') }}-${{ github.sha }}
          restore-keys: embed-react-v1-${{ runner.os }}-${{ hashFiles('bun.lock', 'apps/web/scripts/cached-react-compiler.mjs', 'apps/web/vite.embed.config.ts') }}-
      - run: bun install --frozen-lockfile --filter @synara/web
        if: steps.package.outputs.cache-hit != 'true'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bun run --cwd apps/web build:embed
        if: steps.package.outputs.cache-hit != 'true'
        env:
          SYNARA_COMMIT: ${{ github.sha }}
      - name: Stamp reused package provenance
        if: steps.package.outputs.cache-hit == 'true'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const root = 'apps/web/dist-embed/package';
          const file = `${root}/synara-provenance.json`;
          const provenance = JSON.parse(await fs.readFile(file, 'utf8'));
          provenance.synaraCommit = process.env.GITHUB_SHA;
          provenance.commit = process.env.GITHUB_SHA;
          await fs.writeFile(file, `${JSON.stringify(provenance, null, 2)}\n`);
          await fs.copyFile('apps/web/README.embed.md', `${root}/README.md`);
          console.log(`Reused checked build inputs for ${provenance.commit}`);
          NODE
      - name: Publish immutable channel package
        id: channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            glasswingos/dev) channel=dev; branch=dev ;;
            glasswingos/main) channel=production; branch=main ;;
            *) exit 1 ;;
          esac
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          tag="synara-react-${channel}-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}"
          mkdir -p "$RUNNER_TEMP/embed"
          npm pack ./apps/web/dist-embed/package --pack-destination "$RUNNER_TEMP/embed"
          mv "$RUNNER_TEMP"/embed/*.tgz "$RUNNER_TEMP/synara-react.tgz"
          # Reruns reuse the same immutable package; older runs cannot become latest.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Synara React $channel build $GITHUB_RUN_NUMBER" \
              --notes "Built from $GITHUB_SHA. Protocol version $SYNARA_PROTOCOL_VERSION."
          fi
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]; then
            gh release upload "$tag" "$RUNNER_TEMP/synara-react.tgz" --clobber
            gh release edit "$tag" --draft=false
          fi
      # Dispatch immediately after publication, without waiting for cache upload.
      - name: Trigger Glasswing web build
        env:
          GH_TOKEN: ${{ secrets.GLASSWING_ACTIONS_TOKEN }}
          TARGET_BRANCH: ${{ steps.channel.outputs.branch }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'GLASSWING_ACTIONS_TOKEN must have Actions write permission on glasswing-ai-2.' >&2
            exit 1
          fi
          gh workflow run deploy.yml --repo adityachaudhry/glasswing-ai-2 \
            --ref "$TARGET_BRANCH" -f web_only=true
